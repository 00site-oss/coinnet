<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rewards1</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* Top bar */
    .top-bar {
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 48px;
      font-size: 13px;
      position: relative;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #fff;
    }
    .logo-icon {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .top-right { display: flex; align-items: center; gap: 18px; }
    .on-hold {
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .on-hold strong {
      color: #00ff41;
      font-weight: 600;
    }
    .pts {
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pts strong {
      color: #00ff41;
      font-weight: 600;
    }

    .mobile-toggle {
      display: none;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      width: 36px; height: 36px;
      align-items: center; justify-content: center;
      cursor: pointer;
    }
    .mobile-toggle:hover { background: #252525; color: #fff; }

    /* Nav bar */
    .nav-bar {
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      position: relative;
      z-index: 50;
    }
    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      color: #bbb;
      font-size: 14px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-link:hover { background: #1a1a1a; color: #fff; }
    .nav-link.active { color: #fff; background: #1f1f1f; }
    .nav-icons { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #1a1a1a; border: none; color: #ccc;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
    }
    .icon-btn:hover { background: #252525; color: #fff; }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; cursor: pointer;
      position: relative;
    }
    .user-menu-wrap {
      position: relative;
    }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      min-width: 170px;
      padding: 6px 0;
      z-index: 150;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .user-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #ccc;
      font-size: 14px;
      font-family: inherit;
      padding: 9px 18px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .user-dropdown button:hover {
      background: #252525;
      color: #fff;
    }
    .user-dropdown .menu-divider {
      height: 1px;
      background: #2e2e2e;
      margin: 5px 0;
    }

    .main-layout {
      display: flex;
      min-height: calc(100vh - 100px);
      position: relative;
    }

    /* Left Sidebar */
    .sidebar {
      width: 280px;
      background: #0d0d0d;
      border-right: 1px solid #1a1a1a;
      padding: 8px 0;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: calc(100vh - 100px);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .sidebar-section { border-bottom: 1px solid #1a1a1a; }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      color: #ccc;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: background 0.15s;
    }
    .sidebar-header:hover { background: #161616; color: #fff; }
    .sidebar-header.open { color: #fff; }
    .sidebar-header .arrow {
      color: #666;
      font-size: 11px;
      transition: transform 0.2s;
    }
    .sidebar-header.open .arrow { transform: rotate(180deg); color: #aaa; }
    .sidebar-body { padding: 0 14px 16px; display: none; }
    .sidebar-body.open { display: block; }

    .poll-question { font-size: 14px; color: #ddd; margin-bottom: 12px; line-height: 1.4; }
    .poll-option {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; cursor: pointer; color: #bbb; font-size: 13px;
    }
    .poll-option:hover { color: #fff; }
    .poll-option input { accent-color: #4a9eff; cursor: pointer; }
    .poll-reward { color: #2ecc71; font-size: 13px; font-weight: 600; margin: 12px 0 10px; }
    .btn {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-vote {
      background: linear-gradient(180deg, #e8e8e8, #c8c8c8);
      color: #222; width: 100%; margin-bottom: 10px;
    }
    .btn-vote:hover { opacity: 0.9; }
    .btn-vote:disabled { opacity: 0.5; cursor: not-allowed; }
    .past-polls { text-align: center; color: #4a9eff; font-size: 13px; cursor: pointer; }
    .past-polls:hover { text-decoration: underline; }

    .goal-title { font-size: 14px; color: #ccc; margin-bottom: 12px; text-align: center; }
    .paypal-box {
      background: #fff; border-radius: 8px; padding: 14px 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; max-width: 180px;
    }
    .paypal-logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .paypal-logo .p-blue { color: #003087; }
    .paypal-logo .p-light { color: #009cde; }
    .goal-progress-bar {
      height: 10px; background: #222; border-radius: 5px; overflow: hidden;
    }
    .goal-progress-fill {
      height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60);
      border-radius: 5px; transition: width 0.4s;
    }
    .goal-stats { font-size: 12px; color: #888; margin-top: 6px; }
    .goal-earned { color: #2ecc71; font-size: 12px; margin-top: 4px; }

    .cashout6-wrap { text-align: center; padding: 8px 0; }
    .cashout6-logo {
      font-size: 26px; font-weight: 900; letter-spacing: 1px;
      margin-bottom: 16px; line-height: 1;
    }
    .cashout6-logo .cash { color: #f1c40f; text-shadow: 0 0 12px rgba(241,196,15,0.4); }
    .cashout6-logo .out { color: #f1c40f; }
    .cashout6-logo .six {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      background: #c0392b; color: #fff; font-size: 18px;
      margin-left: 4px; vertical-align: middle;
      box-shadow: 0 0 10px rgba(192,57,43,0.5);
    }
    .circles-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; max-width: 180px; margin: 0 auto 14px;
    }
    .circle-slot {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px dashed #555; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #666; margin: 0 auto;
      transition: border-color 0.2s, background 0.2s;
    }
    .circle-slot.filled {
      border: 2px solid #2ecc71; background: #1a2e1a;
      color: #2ecc71; font-weight: 700;
    }
    .cashout6-msg { color: #f1c40f; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .btn-claim {
      background: linear-gradient(180deg, #e8e8e8, #c8c8c8);
      color: #222; width: 100%; max-width: 180px;
    }
    .btn-claim:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-claim.ready {
      background: linear-gradient(180deg, #2ecc71, #27ae60); color: #fff;
    }
    .cashout6-bonus { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }

    .credit-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #1a1a1a; font-size: 12px;
    }
    .credit-item:last-child { border-bottom: none; }
    .credit-time { color: #666; white-space: nowrap; min-width: 52px; }
    .credit-body { flex: 1; line-height: 1.35; }
    .credit-body strong { color: #ddd; }
    .credit-body .user { color: #4a9eff; }
    .credit-flag { font-size: 11px; color: #666; }

    .news-item { padding: 10px 0; border-bottom: 1px solid #1a1a1a; }
    .news-item:last-child { border-bottom: none; }
    .news-date { font-size: 11px; color: #666; margin-bottom: 2px; }
    .news-title { font-size: 13px; color: #ccc; }
    .news-title:hover { color: #fff; cursor: pointer; }

    /* Content */
    .content {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      max-height: calc(100vh - 100px);
    }
    .section-title {
      font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 8px;
    }
    .section-sub {
      font-size: 13px; color: #888; margin-bottom: 24px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      max-width: 1100px;
    }
    .card {
      background: #151515;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #222;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #333;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-top {
      height: 100px;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card-top .card-icon {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
    }
    .card-top .card-icon svg { width: 40px; height: 40px; }
    .card-top .placeholder {
      font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
      text-align: center; line-height: 1.2;
    }
    .card-info { padding: 12px 14px 16px; background: #111; }
    .card-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: #888; line-height: 1.45; }
    .card-meta {
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px; font-size: 12px;
    }
    .card-pts { color: #2ecc71; font-weight: 600; }

    .logo-revenue { color: #a8d08d; }
    .logo-wallads { color: #f1c40f; }
    .logo-torox { color: #9b59b6; }
    .logo-lootably { color: #3498db; }
    .logo-ayet { color: #e67e22; }
    .logo-monlix { color: #1abc9c; }
    .logo-wannads { color: #e74c3c; }
    .logo-adwall { color: #3498db; }

    /* Chat */
    .chat-toggle {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 28px; height: 56px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-right: none;
      border-radius: 8px 0 0 8px;
      color: #ccc;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, right 0.3s ease;
    }
    .chat-toggle:hover { background: #252525; color: #fff; }
    .chat-toggle.open { right: 340px; }

    .chat-panel {
      width: 0;
      background: #0d0d0d;
      border-left: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease;
      flex-shrink: 0;
      max-height: calc(100vh - 100px);
    }
    .chat-panel.open { width: 340px; }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    .chat-tabs { display: flex; gap: 16px; }
    .chat-tab {
      background: none; border: none; color: #888;
      font-size: 14px; font-weight: 600; cursor: pointer;
      padding: 4px 0; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .chat-tab.active { color: #fff; border-bottom-color: #fff; }
    .chat-header-right {
      display: flex; align-items: center; gap: 8px; color: #666; font-size: 13px;
    }
    .online-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2ecc71; display: inline-block;
    }
    .chat-close-btn {
      background: none; border: none; color: #888;
      cursor: pointer; padding: 2px 6px; border-radius: 4px;
      display: flex; align-items: center;
    }
    .chat-close-btn:hover { background: #222; color: #fff; }

    .chat-search {
      padding: 8px 12px; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    .chat-search input {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 6px; padding: 7px 12px; color: #ccc;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .chat-search input::placeholder { color: #555; }
    .chat-search input:focus { border-color: #444; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px 10px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .chat-msg { display: flex; gap: 8px; align-items: flex-start; }
    .chat-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #aaa; flex-shrink: 0;
    }
    .chat-avatar.mod { background: #1a3a2a; color: #2ecc71; }
    .chat-avatar.elite { background: #2a1a3a; color: #9b59b6; }
    .chat-avatar.rookie { background: #1a2a1a; color: #27ae60; }
    .chat-avatar.unknown { background: #333; color: #888; }
    .chat-bubble-wrap { flex: 1; min-width: 0; }
    .chat-meta {
      display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    }
    .chat-name { font-size: 13px; font-weight: 600; color: #ddd; }
    .chat-badge {
      font-size: 9px; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; text-transform: uppercase;
    }
    .badge-mod { background: #1a3a2a; color: #2ecc71; }
    .badge-elite { background: #2a1a3a; color: #9b59b6; }
    .badge-rookie { background: #1a2a1a; color: #27ae60; }
    .chat-time { font-size: 11px; color: #555; margin-left: auto; }
    .chat-bubble {
      background: #1a1a1a; border-radius: 0 10px 10px 10px;
      padding: 8px 12px; font-size: 13px; line-height: 1.4;
      color: #ccc; word-break: break-word;
    }
    .chat-bubble .mention { color: #4a9eff; }
    .chat-bubble.deleted {
      background: #1a1212; color: #e74c3c; font-style: italic;
    }
    .chat-bubble .view-msg {
      color: #4a9eff; font-size: 12px; cursor: pointer;
      margin-top: 4px; display: inline-flex; align-items: center; gap: 4px;
    }
    .chat-bubble .view-msg:hover { text-decoration: underline; }
    .chat-input-area {
      padding: 10px 12px; border-top: 1px solid #1a1a1a; flex-shrink: 0;
    }
    .chat-input-area input {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 10px 14px; color: #ccc;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .chat-input-area input::placeholder { color: #555; }
    .chat-input-area input:focus { border-color: #444; }

    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 80;
    }
    .sidebar-overlay.show { display: block; }

    /* Redeem Code Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: #141414;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      width: 100%;
      max-width: 420px;
      padding: 36px 32px 28px;
      position: relative;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { color: #fff; background: #222; }
    .modal-title {
      font-size: 22px;
      font-weight: 700;
      color: #c8c8c8;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }
    .modal-input {
      width: 100%;
      max-width: 280px;
      height: 40px;
      background: #fff;
      border: none;
      border-left: 3px solid #c0392b;
      border-radius: 2px;
      padding: 0 12px;
      font-size: 15px;
      font-family: inherit;
      color: #111;
      outline: none;
      margin: 0 auto 20px;
      display: block;
    }
    .modal-input:focus {
      box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.25);
    }
    .modal-social {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .modal-social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .modal-social a:hover { opacity: 0.8; }
    .modal-social .tw {
      background: #1da1f2;
      color: #fff;
    }
    .modal-social .fb {
      background: #1877f2;
      color: #fff;
    }
    .modal-social a svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .modal-submit {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      padding: 8px 28px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .modal-submit:hover { background: #4a4a4a; color: #fff; }
    .modal-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #2ecc71;
    }
    .modal-msg.error { color: #e74c3c; }

    /* Profile page */
    .profile-page { max-width: 900px; }
    .profile-banner {
      position: relative;
      height: 180px;
      background: #0a0a0a;
      border-radius: 10px 10px 0 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 0;
    }
    .profile-banner-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #0a0a0a 0%, #0a0a0a 35%, transparent 60%),
        repeating-linear-gradient(
          90deg,
          #ff4500 0px, #ff4500 12px,
          #e03a00 12px, #e03a00 24px,
          #c03000 24px, #c03000 36px,
          #ff6a20 36px, #ff6a20 48px,
          #1a0800 48px, #1a0800 60px
        );
      opacity: 0.9;
      image-rendering: pixelated;
    }
    .profile-banner-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .profile-user-meta {
      padding-top: 8px;
    }
    .profile-username {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .profile-status {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      margin-bottom: 10px;
    }
    .profile-actions {
      display: flex;
      gap: 10px;
    }
    .profile-action-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-action-btn:hover { color: #fff; background: #222; }
    .profile-avatar-wrap {
      position: relative;
      margin-top: 20px;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #1a0a00;
      border: 3px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      image-rendering: pixelated;
    }
    .profile-avatar-pixel {
      width: 64px;
      height: 64px;
      background:
        linear-gradient(135deg, #ff4500 25%, #c03000 25%, #c03000 50%, #ff6a20 50%, #ff6a20 75%, #e03a00 75%);
      border-radius: 8px;
      position: relative;
    }
    .profile-avatar-pixel::before {
      content: "";
      position: absolute;
      top: 8px; left: 12px;
      width: 40px; height: 36px;
      background: #ff4500;
      border-radius: 4px 4px 0 0;
      box-shadow:
        8px 4px 0 #c03000,
        0 20px 0 #e03a00,
        20px 24px 0 #ff6a20;
    }
    .profile-rank {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .profile-stats {
      background: #151515;
      border: 1px solid #222;
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 48px;
    }
    .profile-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .profile-stat-label {
      font-size: 13px;
      color: #888;
    }
    .profile-stat-value {
      font-size: 13px;
      color: #ccc;
      font-weight: 500;
    }
    .profile-stat-value .pts-unit {
      font-size: 11px;
      color: #666;
      margin-left: 3px;
    }
    .profile-stat-value .flag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .profile-votes {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }
    .profile-votes span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #888;
      font-size: 13px;
    }

    /* Account page */
    .account-page { max-width: 820px; }
    .account-section { margin-bottom: 36px; }
    .account-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #ddd;
      margin-bottom: 14px;
    }
    .rank-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #ddd;
    }
    .rank-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid #555;
      background: #1a1a1a;
      color: #fff;
    }
    .rank-badge.rookie { background: #1a3a1a; border-color: #2ecc71; color: #2ecc71; }
    .rank-badge.junior { background: #2a2a2a; border-color: #888; color: #ccc; }
    .rank-badge.senior { background: #1a2a3a; border-color: #5dade2; color: #5dade2; }
    .rank-badge.veteran { background: #111; border-color: #aaa; color: #fff; }
    .rank-badge.elite { background: #2a1a3a; border-color: #9b59b6; color: #c39bd3; }
    .rank-badge.legend { background: #3a2a0a; border-color: #e67e22; color: #e67e22; }
    .rank-badge.prime { background: #2a2a1a; border-color: #f1c40f; color: #f1c40f; }
    .rank-note {
      font-size: 12px;
      color: #888;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .rank-table th {
      background: #2a2a2a;
      color: #ccc;
      font-weight: 600;
      padding: 10px 12px;
      text-align: center;
      border: 1px solid #333;
    }
    .rank-table td {
      background: #1a1a1a;
      color: #bbb;
      padding: 10px 12px;
      text-align: center;
      border: 1px solid #2a2a2a;
      vertical-align: middle;
    }
    .rank-table td.perks {
      text-align: left;
      color: #aaa;
      line-height: 1.5;
    }
    .rank-table tr.current td { background: #1f1f1f; }
    .rank-footnote {
      font-size: 12px;
      color: #777;
      margin-bottom: 24px;
    }
    .next-rank-title {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-req {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .progress-req .req-label {
      width: 80px;
      color: #aaa;
      flex-shrink: 0;
    }
    .progress-bar-sm {
      width: 120px;
      height: 14px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .progress-bar-sm .fill {
      height: 100%;
      background: #1a5fb4;
      border-radius: 2px;
    }
    .progress-bar-sm .fill-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #fff;
      font-weight: 600;
    }
    .progress-req .req-desc { color: #777; font-size: 12px; }

    .account-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 24px;
      max-width: 420px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      color: #eee;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .form-group input:focus { border-color: #555; }
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-save {
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-save:hover { opacity: 0.9; }
    .btn-cancel {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel:hover { background: #333; color: #fff; }
    .form-msg { margin-top: 12px; font-size: 13px; color: #2ecc71; }
    .form-msg.error { color: #e74c3c; }

    /* Quiz modal */
    .quiz-modal-box {
      background: #141414;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 28px 24px;
      position: relative;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .quiz-header {
      margin-bottom: 18px;
    }
    .quiz-offer-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .quiz-meta {
      font-size: 12px;
      color: #888;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .quiz-meta strong { color: #00ff41; }
    .quiz-meta .warn { color: #e74c3c; }
    .quiz-question {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #222;
    }
    .quiz-question:last-of-type { border-bottom: none; }
    .quiz-q-text {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #bbb;
      margin-bottom: 4px;
      transition: background 0.12s;
    }
    .quiz-option:hover { background: #1a1a1a; color: #fff; }
    .quiz-option.selected {
      background: #1a2a3a;
      color: #fff;
      border: 1px solid #3498db;
    }
    .quiz-option input { accent-color: #3498db; cursor: pointer; }
    .quiz-result {
      text-align: center;
      padding: 16px 0;
    }
    .quiz-result .score {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .quiz-result .score.pass { color: #2ecc71; }
    .quiz-result .score.fail { color: #e74c3c; }
    .quiz-result .detail {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .quiz-result .pts-change {
      font-size: 16px;
      font-weight: 600;
      margin: 12px 0;
    }
    .quiz-result .pts-change.pos { color: #2ecc71; }
    .quiz-result .pts-change.neg { color: #e74c3c; }
    .card-pts-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
    }
    .card-pts-row .pts-val { color: #2ecc71; font-weight: 600; }
    .card-pts-row .pass-info { color: #666; }

    /* Auth screen */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      padding: 20px;
    }
    .auth-box {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo .logo-icon {
      width: 48px; height: 48px;
      font-size: 22px;
      margin: 0 auto 10px;
    }
    .auth-logo h1 {
      font-size: 22px;
      color: #fff;
      font-weight: 700;
    }
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border-bottom: 1px solid #2a2a2a;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      border-bottom: 2px solid transparent;
    }
    .auth-tab.active {
      color: #fff;
      border-bottom-color: #2ecc71;
    }
    .auth-error {
      background: #2a1212;
      border: 1px solid #e74c3c;
      color: #e74c3c;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .auth-success {
      background: #122a12;
      border: 1px solid #2ecc71;
      color: #2ecc71;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .auth-submit {
      width: 100%;
      background: linear-gradient(180deg, #2ecc71, #27ae60);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }
    .auth-submit:hover { opacity: 0.9; }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-loading {
      text-align: center;
      color: #888;
      padding: 40px;
      font-size: 14px;
    }

    /* Mobile: sidebars hidden by default */
    @media (max-width: 900px) {
      .mobile-toggle { display: flex; }

      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 90;
        max-height: 100vh;
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
        width: 280px;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }

      .chat-panel {
        position: fixed;
        right: 0; top: 0; bottom: 0;
        z-index: 90;
        max-height: 100vh;
        width: 0 !important;
      }
      .chat-panel.open {
        width: min(340px, 90vw) !important;
      }

      .chat-toggle { display: none; }

      .content { padding: 20px 16px; }
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .nav-link span.label { display: none; }
      .nav-bar { padding: 0 10px; }
    }
  </style>

      const [code, setCode] = useState("");
      const [msg, setMsg] = useState(null);
      const [busy, setBusy] = useState(false);

      if (!open) return null;

      const handleSubmit = async () => {
        if (!code.trim()) {
          setMsg({ type: "error", text: "Please enter a code." });
          return;
        }
        setBusy(true);
        setMsg({ type: "ok", text: "Checking code..." });
        try {
          const r = await api("redeemCode", { user_id: user?.id, code: code.trim() });
          if (!r.ok) {
            setMsg({ type: "error", text: r.error || "Invalid or expired code." });
          } else {
            setMsg({ type: "ok", text: r.message || ("Redeemed +" + r.points + " PTS!") });
            setCode("");
            if (onRedeemed) onRedeemed();
          }
        } catch (e) {
          setMsg({ type: "error", text: "Connection error." });
        }
        setBusy(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose} title="Close">
              <Icon name="Close" size={18} />
            </button>
            <h2 className="modal-title">Redeem Your Code</h2>
            <input
              className="modal-input"
              type="text"
              value={code}
              onChange={(e) => { setCode(e.target.value); setMsg(null); }}
              onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
              autoFocus
            />
            <div className="modal-social">
              Follow us on social media to get codes:
              <a className="tw" href="https://twitter.com" target="_blank" rel="noreferrer" title="Twitter">
                <Icon name="Twitter" size={12} />
              </a>
              <a className="fb" href="https://facebook.com" target="_blank" rel="noreferrer" title="Facebook">
                <Icon name="Facebook" size={12} />
              </a>
            </div>
            <button className="modal-submit" onClick={handleSubmit}>Submit</button>
            {msg && (
              <div className={`modal-msg ${msg.type === "error" ? "error" : ""}`}>
                {msg.text}
              </div>
            )}
          </div>
        </div>
      );

    function DailyPoll({ user, onUserUpdate }) {
      const [poll, setPoll] = useState(null);
      const [selected, setSelected] = useState(null);
      const [voted, setVoted] = useState(false);
      const [msg, setMsg] = useState("");
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        api("getPoll").then((r) => {
          if (r.ok && r.poll) setPoll(r.poll);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      const vote = async () => {
        if (selected === null || !poll) return;
        const r = await api("votePoll", {
          user_id: user?.id,
          poll_id: poll.id,
          option_index: selected
        });
        if (r.ok) {
          setVoted(true);
          setMsg("+" + (r.reward || 1) + " PT");
          if (onUserUpdate) onUserUpdate();
        } else {
          setMsg(r.error || "Vote failed");
        }
      };

      if (loading) return <div style={{ color: "#666", fontSize: 12 }}>Loading...</div>;
      if (!poll) return <div style={{ color: "#666", fontSize: 12 }}>No active poll.</div>;

      const options = Array.isArray(poll.options) ? poll.options : [];
      return (
        <div>
          <p className="poll-question">{poll.question}</p>
          {options.map((opt, i) => (
            <label key={i} className="poll-option">
              <input type="radio" name="daily-poll" checked={selected === i} disabled={voted} onChange={() => setSelected(i)} />
              {opt}
            </label>
          ))}
          <div className="poll-reward">+{poll.reward || 1} PT</div>
          <button className="btn btn-vote" disabled={selected === null || voted} onClick={vote}>
            {voted ? "Voted" : "Vote"}
          </button>
          {msg && <div style={{ fontSize: 12, color: "#2ecc71", marginTop: 6 }}>{msg}</div>}
        </div>
      );
    }

      return (
        <div className="cashout6-wrap">

            <span className="out">OUT</span>
            <span className="six">6</span>

          <div className="cashout6-msg">Collect all 6 and win!</div>
          <button
            className={`btn btn-claim ${allFilled ? "ready" : ""}`}
            disabled={!allFilled || bonus === 0}

          </div>
        </div>
      );

              user: m.username,

              text: m.message,
              deleted: m.deleted,
              deletedBy: m.deleted_by
            })));

      const [step, setStep] = useState("input"); // input | confirm | done
      const [msg, setMsg] = useState(null);
      const [busy, setBusy] = useState(false);
      const USERNAME_COST = 250;
      const balance = Number(user?.balance) || 0;

      useEffect(() => {
        if (user?.username) setUsername(user.username);
      }, [user]);

      const leftStats = [
        { label: "Total Earnings", value: <>10117.99<span className="pts-unit">PTS</span></> },
        { label: "Contest Winnings", value: <>103<span className="pts-unit">PTS</span></> },
        { label: "Lotteries", value: <>0<span className="pts-unit">PTS</span></> },
        { label: "Referrals", value: "0" },
        { label: "Forum Posts", value: "0" },
      ];
      const rightStats = [
        {
          label: "Trades",
          value: (
            <span className="profile-votes">
              <span><Icon name="ThumbUp" size={14} /> 0</span>
              <span><Icon name="ThumbDown" size={14} /> 0</span>
            </span>
          )
        },
        { label: "Member Since", value: "Jan 6, 2022" },
        { label: "From", value: <span className="flag">United States</span> },
        { label: "Ref Source", value: "none" },
      ];

      const openEdit = () => {
        setNewName(username);
        setStep("input");
        setMsg(null);
        setEditOpen(true);
      };

      const closeEdit = () => {
        setEditOpen(false);
        setStep("input");
        setMsg(null);
      };

      const handleNext = () => {
        const name = newName.trim();
        if (!name || name.length < 3 || name.length > 20) {
          setMsg({ type: "error", text: "Username must be 3–20 characters." });
          return;
        }
        if (!/^[a-zA-Z0-9_]+$/.test(name)) {
          setMsg({ type: "error", text: "Only letters, numbers, and underscores." });
          return;
        }
        if (name.toLowerCase() === username.toLowerCase()) {
          setMsg({ type: "error", text: "That is already your username." });
          return;
        }
        setMsg(null);
        setStep("confirm");
      };

      const handleConfirm = async () => {
        if (balance < USERNAME_COST) {
          setMsg({
            type: "error",
            text: "Not enough points. Username change costs " + USERNAME_COST + " PTS. You have " + balance + " PTS."
          });
          return;
        }
        setBusy(true);
        try {
          const r = await api("changeUsername", {
            user_id: user.id,
            new_username: newName.trim(),
            confirm: true
          });
          if (!r.ok) {
            setMsg({ type: "error", text: r.error || "Failed to change username." });
            setBusy(false);
            return;
          }
          setUsername(r.username || newName.trim());
          if (setUser && r.username) {
            setUser((u) => ({ ...u, username: r.username, balance: r.balance != null ? r.balance : u.balance }));
          }
          if (onUserUpdate) onUserUpdate();
          setStep("done");
          setMsg({ type: "ok", text: r.message || ("Username changed. " + USERNAME_COST + " PTS deducted.") });
        } catch (e) {
          setMsg({ type: "error", text: "Connection error." });
        }
        setBusy(false);
      };

      return (
        <div className="profile-page">
          <div className="profile-banner">
            <div className="profile-banner-bg" />
            <div className="profile-banner-content">
              <div className="profile-user-meta">
                <div className="profile-username">{username}</div>
                <div className="profile-status">is offline</div>
                <div className="profile-actions">
                  <button className="profile-action-btn" title="Change username" onClick={openEdit}>
                    <Icon name="Edit" size={18} />
                  </button>
                  <button className="profile-action-btn" title="Settings">
                    <Icon name="Settings" size={18} />
                  </button>
                </div>
              </div>
              <div className="profile-avatar-wrap">
                <div className="profile-avatar">
                  <div className="profile-avatar-pixel" />
                </div>
                <div className="profile-rank">VETERAN</div>
              </div>
            </div>
          </div>
          <div className="profile-stats">
            <div>
              {leftStats.map((s, i) => (
                <div key={i} className="profile-stat-row">
                  <span className="profile-stat-label">{s.label}</span>
                  <span className="profile-stat-value">{s.value}</span>
                </div>
              ))}
            </div>
            <div>
              {rightStats.map((s, i) => (
                <div key={i} className="profile-stat-row">
                  <span className="profile-stat-label">{s.label}</span>
                  <span className="profile-stat-value">{s.value}</span>
                </div>
              ))}
            </div>
          </div>

          {editOpen && (
            <div className="modal-overlay" onClick={closeEdit}>
              <div className="modal-box" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 380 }}>
                <button className="modal-close" onClick={closeEdit} title="Close">
                  <Icon name="Close" size={18} />
                </button>
                <h2 className="modal-title">Change Username</h2>

                {step === "input" && (
                  <>
                    <p style={{ fontSize: 13, color: "#888", marginBottom: 16 }}>
                      Changing your username costs <strong style={{ color: "#00ff41" }}>{USERNAME_COST} PTS</strong>.
                    </p>
                    <input
                      className="modal-input"
                      type="text"
                      value={newName}
                      onChange={(e) => { setNewName(e.target.value); setMsg(null); }}
                      onKeyDown={(e) => e.key === "Enter" && handleNext()}
                      placeholder="New username"
                      autoFocus
                    />
                    <button className="modal-submit" onClick={handleNext} style={{ marginTop: 8 }}>
                      Continue
                    </button>
                  </>
                )}

                {step === "confirm" && (
                  <>
                    <p style={{ fontSize: 14, color: "#ccc", marginBottom: 8 }}>
                      Change username to <strong style={{ color: "#fff" }}>{newName.trim()}</strong>?
                    </p>
                    <p style={{ fontSize: 13, color: "#888", marginBottom: 20 }}>
                      This will cost <strong style={{ color: "#00ff41" }}>{USERNAME_COST} PTS</strong>. This cannot be undone.
                    </p>
                    <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                      <button className="btn-save" onClick={handleConfirm}>Yes, proceed</button>
                      <button className="btn-cancel" onClick={() => setStep("input")}>Back</button>
                    </div>
                  </>
                )}

                {step === "done" && (
                  <>
                    <p style={{ fontSize: 14, color: "#2ecc71", marginBottom: 16 }}>
                      Username updated successfully.
                    </p>
                    <button className="modal-submit" onClick={closeEdit}>Done</button>
                  </>
                )}

                {msg && (
                  <div className={`modal-msg ${msg.type === "error" ? "error" : ""}`}>
                    {msg.text}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function QuizModal({ offer, user, onClose, onComplete }) {
      const [questions, setQuestions] = useState([]);
      const [offerInfo, setOfferInfo] = useState(offer);
      const [answers, setAnswers] = useState({});
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError("");
        api("getQuiz", { offer_id: offer.id, user_id: user?.id }).then((r) => {
          if (cancelled) return;
          if (!r.ok) {
            setError(r.error || "Could not load quiz.");
            setLoading(false);
            return;
          }
          setQuestions(r.questions || []);
          setOfferInfo({ ...offer, ...r.offer });
          setLoading(false);
        }).catch(() => {
          if (!cancelled) {
            setError("Connection error loading quiz.");
            setLoading(false);
          }
        });
        return () => { cancelled = true; };
      }, [offer.id, user?.id]);

      const allAnswered = questions.length > 0 && questions.every((q) => answers[q.id] !== undefined);
      const passPercent = offerInfo.pass_percent || offer.pass_percent || 70;
      const points = offerInfo.points || offer.points || 0;
      const triesLeft = offerInfo.tries_left != null ? offerInfo.tries_left : (offer.max_tries || 3);

      const submit = async () => {
        if (!allAnswered || busy) return;
        setBusy(true);
        try {
          const r = await api("submitQuiz", {
            offer_id: offer.id,
            user_id: user?.id,
            answers
          });
          if (!r.ok) {
            setError(r.error || "Submit failed.");
            setBusy(false);
            return;
          }
          setResult({
            passed: r.passed,
            score: r.score_percent,
            correct: r.correct,
            total: r.total,
            pointsAwarded: r.points_awarded,
            message: r.message
          });
          if (onComplete) onComplete(r.points_awarded, r.passed);
        } catch (e) {
          setError("Connection error.");
        }
        setBusy(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="quiz-modal-box" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose} title="Close">
              <Icon name="Close" size={18} />
            </button>

            <div className="quiz-header">
              <div className="quiz-offer-name">{offerInfo.name || offer.name}</div>
              <div className="quiz-meta">
                <span>Worth <strong>{points} PTS</strong></span>
                <span>Pass rate <strong>{passPercent}%</strong></span>
                <span>Tries left <strong>{triesLeft}</strong></span>
                <span className="warn">Fail = −{Math.round(points / 2)} PTS</span>
              </div>
            </div>

            {loading && <div className="auth-loading">Loading quiz...</div>}
            {error && !result && <div className="auth-error">{error}</div>}

            {!loading && !result && questions.length > 0 && (
              <>
                {questions.map((q, qi) => (
                  <div key={q.id} className="quiz-question">
                    <div className="quiz-q-text">{qi + 1}. {q.question}</div>
                    {(q.options || []).map((opt, oi) => (
                      <label
                        key={oi}
                        className={`quiz-option ${answers[q.id] === oi ? "selected" : ""}`}
                      >
                        <input
                          type="radio"
                          name={q.id}
                          checked={answers[q.id] === oi}
                          onChange={() => setAnswers((a) => ({ ...a, [q.id]: oi }))}
                        />
                        {opt}
                      </label>
                    ))}
                  </div>
                ))}
                <button
                  className="btn-save"
                  style={{ width: "100%", marginTop: 8 }}
                  disabled={!allAnswered || busy}
                  onClick={submit}
                >
                  {busy ? "Submitting..." : "Submit Quiz"}
                </button>
              </>
            )}

            {result && (
              <div className="quiz-result">
                <div className={`score ${result.passed ? "pass" : "fail"}`}>
                  {result.score}%
                </div>
                <div className="detail">
                  {result.correct}/{result.total} correct — need {passPercent}% to pass
                </div>
                <div className={`pts-change ${result.passed ? "pos" : "neg"}`}>
                  {result.passed
                    ? "+" + result.pointsAwarded + " PTS earned!"
                    : result.pointsAwarded + " PTS penalty"}
                </div>
                <div className="detail" style={{ marginBottom: 16 }}>
                  {result.message || (result.passed
                    ? "Great job! Points have been added to your balance."
                    : "You did not meet the pass requirement. Half the offer value was deducted.")}
                </div>
                <button className="modal-submit" onClick={onClose}>Close</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const PARTNER_STYLES = {
      "Revenue Universe": { logoClass: "logo-revenue", logoText: "REVENUE UNIVERSE", bg: "#1a2a1a" },
      "WallAds": { logoClass: "logo-wallads", logoText: "WALL Ads", bg: "#2a2a1a" },
      "Torox": { logoClass: "logo-torox", logoText: "TOROX", bg: "#1a1a2a" },
      "lootably": { logoClass: "logo-lootably", logoText: "lootably", bg: "#1a2a3a" },
      "ayeT-Studios": { logoClass: "logo-ayet", logoText: "ayeT STUDIOS", bg: "#2a1a1a" },
      "Monlix": { logoClass: "logo-monlix", logoText: "Monlix", bg: "#1a2a2a" },
      "Wannads": { logoClass: "logo-wannads", logoText: "WANNADS", bg: "#2a1a1a" },
      "Adwall": { logoClass: "logo-adwall", logoText: "AdscendMedia", bg: "#1a1a2a" }
    };

    function EarnPage({ user, onUserUpdate }) {
      const [list, setList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [activeOffer, setActiveOffer] = useState(null);

      const load = () => {
        setLoading(true);
        api("getPartners", { user_id: user?.id }).then((r) => {
          if (r.ok) setList(r.partners || []);
          else setError(r.error || "Failed to load offers.");
          setLoading(false);
        }).catch(() => {
          setError("Connection error.");
          setLoading(false);
        });
      };

      useEffect(() => { load(); }, [user?.id]);

      return (
        <section>
          <h2 className="section-title">Offer Partners</h2>
          <p className="section-sub">
            Click an offer to take its quiz. Pass to earn full points — fail and you lose half as a penalty.
          </p>
          {loading && <div className="auth-loading">Loading offers...</div>}
          {error && <div className="auth-error">{error}</div>}
          {!loading && !error && list.length === 0 && (
            <p style={{ color: "#888" }}>No offers available. Run setup() in Apps Script to seed data.</p>
          )}
          <div className="cards-grid">
            {list.map((c) => {
              const style = PARTNER_STYLES[c.name] || PARTNER_STYLES[c.partner] || {
                logoClass: "", logoText: (c.name || "?").toUpperCase(), bg: "#1a1a1a"
              };
              return (
                <div key={c.id} className="card" onClick={() => setActiveOffer(c)}>
                  <div className="card-top" style={{ background: style.bg }}>
                    <div className={`placeholder ${style.logoClass}`}>{style.logoText}</div>
                  </div>
                  <div className="card-info">
                    <div className="card-name">{c.name}</div>
                    <div className="card-desc">{c.description}</div>
                    <div className="card-pts-row">
                      <span className="pts-val">{c.points} PTS</span>
                      <span className="pass-info">
                        Pass {c.pass_percent}% · {c.tries_left != null ? c.tries_left : c.max_tries} tries left
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {activeOffer && (
            <QuizModal
              offer={activeOffer}
              user={user}
              onClose={() => { setActiveOffer(null); load(); }}
              onComplete={() => { if (onUserUpdate) onUserUpdate(); }}
            />
          )}
        </section>
      );
    }

    function CardGrid({ title, subtitle, cards, isPartner }) {
      return (
        <section>
          <h2 className="section-title">{title}</h2>
          {subtitle && <p className="section-sub">{subtitle}</p>}
          <div className="cards-grid">
            {cards.map((c) => (
              <div key={c.id} className="card">
                <div className="card-top" style={{ background: c.bg || "#1a1a1a" }}>
                  {isPartner ? (
                    <div className={`placeholder ${c.logoClass}`}>{c.logoText}</div>
                  ) : (
                    <div className="card-icon" style={{ color: c.color }}>
                      <Icon name={c.icon} size={40} />
                    </div>
                  )}
                </div>
                <div className="card-info">
                  <div className="card-name">{c.name}</div>
                  <div className="card-desc">{c.desc}</div>
                  {c.pts && (
                    <div className="card-meta">
                      <span className="card-pts">{c.pts}</span>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function PageContent({ page, user, onUserUpdate, setUser }) {
      switch (page) {
        case "home":
          return <CardGrid title="Home" subtitle={"Welcome back, " + (user?.username || "") + "!"} cards={homeCards} />;
        case "earn":
          return <EarnPage user={user} onUserUpdate={onUserUpdate} />;
        case "redeem":
          return <CardGrid title="Redeem" subtitle="Cash out your points for real rewards." cards={redeemCards} />;
        case "win":
          return <CardGrid title="Win" subtitle="Play games and contests for bonus points." cards={winCards} />;
        case "faq":
          return <CardGrid title="FAQ" subtitle="Frequently asked questions and help." cards={faqCards} />;
        case "profile":
          return <ProfilePage user={user} setUser={setUser} onUserUpdate={onUserUpdate} />;
        case "account":
          return <AccountPage user={user} onUserUpdate={onUserUpdate} />;
        default:
          return <EarnPage user={user} onUserUpdate={onUserUpdate} />;
      }
    }

    // ─── API ─────────────────────────────────────────────────
    const API_URL = "https://script.google.com/macros/s/AKfycbzlSlYIt5LDNA8of_CvJqHaaUesr6ntPPgquS91guXUMb8_cCNZiVSOq_sH_pODCJ9z/exec";

    async function api(action, data = {}) {
      const params = new URLSearchParams({ action, ...Object.fromEntries(
        Object.entries(data).map(([k, v]) => [k, typeof v === "object" ? JSON.stringify(v) : String(v ?? "")])
      )});
      // GET for simple reads; POST body for writes
      const writeActions = ["login", "register", "changeUsername", "updateAccount", "votePoll", "submitQuiz", "redeemCode", "sendChat", "requestCashout", "claimCashout6"];
      const isWrite = writeActions.includes(action);
      let res;
      if (isWrite) {
        res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, ...data })
        });
      } else {
        res = await fetch(API_URL + "?" + params.toString());
      }
      return res.json();
    }

    function AuthScreen({ onAuth }) {
      const [tab, setTab] = useState("login");
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [success, setSuccess] = useState("");
      const [loading, setLoading] = useState(false);

      const submit = async (e) => {
        e.preventDefault();
        setError("");
        setSuccess("");
        setLoading(true);
        try {
          if (tab === "login") {
            const r = await api("login", { username, password });
            if (!r.ok) { setError(r.error || "Login failed"); setLoading(false); return; }
            localStorage.setItem("r1_user", JSON.stringify(r.user));
            onAuth(r.user);
          } else {
            if (!username || !email || !password) {
              setError("All fields are required.");
              setLoading(false);
              return;
            }
            const r = await api("register", { username, email, password });
            if (!r.ok) { setError(r.error || "Signup failed"); setLoading(false); return; }
            localStorage.setItem("r1_user", JSON.stringify(r.user));
            setSuccess("Account created! Signing you in...");
            onAuth(r.user);
          }
        } catch (err) {
          setError("Connection error. Please try again.");
        }
        setLoading(false);
      };

      return (
        <div className="auth-screen">
          <div className="auth-box">
            <div className="auth-logo">
              <div className="logo-icon">R</div>
              <h1>Rewards1</h1>
            </div>
            <div className="auth-tabs">
              <button className={`auth-tab ${tab === "login" ? "active" : ""}`} onClick={() => { setTab("login"); setError(""); }}>
                Login
              </button>
              <button className={`auth-tab ${tab === "signup" ? "active" : ""}`} onClick={() => { setTab("signup"); setError(""); }}>
                Sign Up
              </button>
            </div>
            {error && <div className="auth-error">{error}</div>}
            {success && <div className="auth-success">{success}</div>}
            <form onSubmit={submit}>
              <div className="form-group">
                <label>Username</label>
                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} autoFocus required />
              </div>
              {tab === "signup" && (
                <div className="form-group">
                  <label>Email</label>
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
                </div>
              )}
              <div className="form-group">
                <label>Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
              </div>
              <button type="submit" className="auth-submit" disabled={loading}>
                {loading ? "Please wait..." : (tab === "login" ? "Login" : "Create Account")}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [booting, setBooting] = useState(true);
      const [activeNav, setActiveNav] = useState("earn");
      const [cashouts, setCashouts] = useState([0, 0, 0, 0, 0, 0]);
      const [chatOpen, setChatOpen] = useState(typeof window !== "undefined" && window.innerWidth > 900);
      const [leftOpen, setLeftOpen] = useState(false);
      const [codeOpen, setCodeOpen] = useState(false);

      // Restore session
      useEffect(() => {
        const saved = localStorage.getItem("r1_user");
        if (saved) {
          try {
            const u = JSON.parse(saved);
            // Refresh user from API
            api("getUser", { user_id: u.id || u.username }).then((r) => {
              if (r.ok && r.user) {
                setUser(r.user);
                localStorage.setItem("r1_user", JSON.stringify(r.user));
              } else {
                localStorage.removeItem("r1_user");
              }
              setBooting(false);
            }).catch(() => {
              setUser(u);
              setBooting(false);
            });
          } catch (e) {
            localStorage.removeItem("r1_user");
            setBooting(false);
          }
        } else {
          setBooting(false);
        }
      }, []);

      const handleLogout = () => {
        localStorage.removeItem("r1_user");
        setUser(null);
        setActiveNav("earn");
      };

      const refreshUser = async () => {
        if (!user) return;
        try {
          const r = await api("getUser", { user_id: user.id });
          if (r.ok && r.user) {
            setUser(r.user);
            localStorage.setItem("r1_user", JSON.stringify(r.user));
          }
        } catch (e) {}
      };

      const handleClaim = (bonus) => {
        if (bonus > 0) {
          setCashouts([0, 0, 0, 0, 0, 0]);
          alert("Claimed " + bonus + " bonus points!");
          refreshUser();
        }
      };

      const closeMobile = () => {
        setLeftOpen(false);
        if (window.innerWidth <= 900) setChatOpen(false);
      };

      if (booting) {
        return <div className="auth-loading">Loading Rewards1...</div>;
      }

      if (!user) {
        return <AuthScreen onAuth={(u) => setUser(u)} />;
      }

      return (
        <div>
          <TopBar
            user={user}
            onToggleLeft={() => { setLeftOpen((o) => !o); if (window.innerWidth <= 900) setChatOpen(false); }}
            onToggleChat={() => { setChatOpen((o) => !o); setLeftOpen(false); }}
          />
          <NavBar
            activeNav={activeNav}
            setActiveNav={setActiveNav}
            onOpenCode={() => setCodeOpen(true)}
            user={user}
            onLogout={handleLogout}
          />
          <div className="main-layout">
            <LeftSidebar cashouts={cashouts} onClaimBonus={handleClaim} mobileOpen={leftOpen} user={user} onUserUpdate={refreshUser} />
            <main className="content">
              <PageContent page={activeNav} user={user} onUserUpdate={refreshUser} setUser={setUser} />
            </main>
            <ChatPanel open={chatOpen} onClose={() => setChatOpen(false)} user={user} />
          </div>

          <button
            className={`chat-toggle ${chatOpen ? "open" : ""}`}
            onClick={() => setChatOpen((o) => !o)}
            title={chatOpen ? "Close chat" : "Open chat"}
          >
            <Icon name={chatOpen ? "ChevronRight" : "ChevronLeft"} />
          </button>

          <div
            className={`sidebar-overlay ${leftOpen || (chatOpen && typeof window !== "undefined" && window.innerWidth <= 900) ? "show" : ""}`}
            onClick={closeMobile}
          />

          <RedeemCodeModal open={codeOpen} onClose={() => setCodeOpen(false)} user={user} onRedeemed={refreshUser} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
